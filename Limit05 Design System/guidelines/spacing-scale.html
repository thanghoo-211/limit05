<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--text-body);font-family:var(--font-body);padding:20px 24px}</style>
</head><body><div style="display:flex;align-items:flex-end;gap:16px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--forest-juniper);border-radius:2px;margin:0 auto"></div><div style="font-size:12px;font-weight:600;margin-top:8px">--sp-xs</div><div style="font-size:11px;color:var(--text-muted)">4px</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--forest-juniper);border-radius:2px;margin:0 auto"></div><div style="font-size:12px;font-weight:600;margin-top:8px">--sp-sm</div><div style="font-size:11px;color:var(--text-muted)">8px</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--forest-juniper);border-radius:2px;margin:0 auto"></div><div style="font-size:12px;font-weight:600;margin-top:8px">--sp-md</div><div style="font-size:11px;color:var(--text-muted)">16px</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--forest-juniper);border-radius:2px;margin:0 auto"></div><div style="font-size:12px;font-weight:600;margin-top:8px">--sp-lg</div><div style="font-size:11px;color:var(--text-muted)">32px</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--forest-juniper);border-radius:2px;margin:0 auto"></div><div style="font-size:12px;font-weight:600;margin-top:8px">--sp-xl</div><div style="font-size:11px;color:var(--text-muted)">64px</div></div>
</div></body></html>
