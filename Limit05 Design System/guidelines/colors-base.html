<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Base & surface</title><link rel="stylesheet" href="../styles.css">

</head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--frost-white)"></div><div class="n">Frost White</div><div class="h">#F4F8FA</div><div class="r">Canvas · 60%</div></div>
<div class="s"><div class="chip" style="background:var(--pure-white)"></div><div class="n">Pure White</div><div class="h">#FFFFFF</div><div class="r">Card surface</div></div>
<div class="s"><div class="chip" style="background:var(--glacial-ice-blue)"></div><div class="n">Glacial Ice Blue</div><div class="h">#D7EFFF</div><div class="r">Highlight · 30%</div></div>
</div></body></html>
