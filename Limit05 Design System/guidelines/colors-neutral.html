<!-- @dsCard group="Colors" viewport="700x170" name="Earth neutrals" subtitle="Sage Mist for borders only; Muted Olive is its text-safe substitute" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Earth neutrals</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--text-body);font-family:var(--font-body);padding:20px 24px}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{flex:1 1 0;min-width:120px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--ink-a08)}.n{font-size:13px;font-weight:600;margin-top:8px}.h{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}.r{font-size:11px;color:var(--text-muted);margin-top:2px}</style>
</head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--sage-mist)"></div><div class="n">Sage Mist</div><div class="h">#AEB8A0</div><div class="r">Borders / dividers / inactive icons</div></div>
<div class="s"><div class="chip" style="background:var(--muted-olive)"></div><div class="n">Muted Olive</div><div class="h">#5C6558</div><div class="r">Secondary text</div></div>
<div class="s" style="display:flex;flex-direction:column;justify-content:center"><div style="color:var(--sage-mist);font-weight:600;font-size:15px;text-decoration:line-through">Sage Mist as text — 2.1:1, fails AA</div><div style="color:var(--muted-olive);font-weight:600;font-size:15px;margin-top:6px">Muted Olive as text — 5.6:1, passes AA</div></div>
</div></body></html>
