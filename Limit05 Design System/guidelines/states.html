<!-- @dsCard group="Brand" viewport="700x160" name="Interaction states" subtitle="Hover brightens, focus rings in Terracotta Rust, press settles" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Interaction states</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--text-body);font-family:var(--font-body);padding:20px 24px}</style>
</head><body><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<button style="font:inherit;font-weight:600;padding:14px 28px;border:0;border-radius:var(--radius-sm);background:var(--forest-juniper);color:#fff;box-shadow:var(--shadow-button)">Rest</button>
<button style="font:inherit;font-weight:600;padding:14px 28px;border:0;border-radius:var(--radius-sm);background:var(--forest-juniper);color:#fff;box-shadow:var(--shadow-button-hover);filter:brightness(1.08)">Hover · brightness 1.08</button>
<button style="font:inherit;font-weight:600;padding:14px 28px;border:0;border-radius:var(--radius-sm);background:var(--forest-juniper);color:#fff;box-shadow:var(--shadow-button);outline:3px solid var(--terracotta-rust);outline-offset:2px">Focus · 3px rust</button>
<button style="font:inherit;font-weight:600;padding:14px 28px;border:1px solid var(--sage-mist);border-radius:var(--radius-sm);background:transparent;color:var(--text-body)">Ghost</button>
<button style="font:inherit;font-weight:600;padding:14px 28px;border:0;border-radius:var(--radius-sm);background:var(--forest-juniper);color:#fff;opacity:.45">Disabled</button>
</div></body></html>
