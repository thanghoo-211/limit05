<!-- @dsCard group="Colors" viewport="700x180" name="On-surface pairs" subtitle="Every approved text/ground combination with its measured contrast" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>On-surface pairs</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--text-body);font-family:var(--font-body);padding:20px 24px}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px">
<div style="background:var(--frost-white);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:14px"><div style="color:var(--text-heading);font-weight:700">Dark Pine on Frost</div><div style="color:var(--text-muted);margin-top:4px">14.9:1 · AAA</div></div>
<div style="background:var(--pure-white);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:14px"><div style="color:var(--text-muted);font-weight:700">Muted Olive on white</div><div style="color:var(--text-muted);margin-top:4px">5.9:1 · AA</div></div>
<div style="background:var(--glacial-ice-blue);border-radius:var(--radius-sm);padding:14px"><div style="color:var(--text-heading);font-weight:700">Dark Pine on Ice Blue</div><div style="color:var(--muted-olive);margin-top:4px">14.0:1 · AAA</div></div>
<div style="background:var(--forest-juniper);border-radius:var(--radius-sm);padding:14px"><div style="color:#fff;font-weight:700">White on Forest Juniper</div><div style="color:rgba(255,255,255,.7);margin-top:4px">9.6:1 · AAA</div></div>
<div style="background:var(--terracotta-rust);border-radius:var(--radius-sm);padding:14px"><div style="color:#fff;font-weight:700">White on Terracotta</div><div style="color:rgba(255,255,255,.85);margin-top:4px">3.4:1 · large/bold only</div></div>
<div style="background:var(--dark-pine-slate);border-radius:var(--radius-sm);padding:14px"><div style="color:#fff;font-weight:700">White on Dark Pine</div><div style="color:rgba(255,255,255,.7);margin-top:4px">17.5:1 · AAA</div></div>
</div></body></html>
